            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                type:
                                    type: number
                                    example: 0
                                collegeId:
                                    type: string
                                    example: 65fabc1234567890abcd1234
            responses:
                200:
                    description: Success response
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    data:
                                        type: array
                                        items:
                                            type: object
